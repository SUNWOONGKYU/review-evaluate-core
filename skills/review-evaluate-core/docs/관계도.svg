  <path class="flow" d="M 1070 520 L 1180 520 L 1180 128 L 268 128 L 268 218"/>
  <text class="edgeLabel" x="900" y="135">라운드 결과 보고</text>
    <path class="flow" d="M 850 450 L 850 474"/>
  <text class="edgeLabel" x="872" y="468">반영 확인 결과</text>
  <path class="flowGray" d="M 850 676 L 850 700"/>
  <text class="edgeLabel" x="872" y="694">루브릭 적용</text>
  <path class="flowGray" d="M 850 878 L 850 902"/>
  <text class="edgeLabel" x="872" y="896">점수·판단</text>
  <path class="flowGold" d="M 1070 590 L 1200 590 L 1200 300 L 1318 300"/>
  <text class="edgeLabel" x="1206" y="553">CV=100 → 각 1회</text>
  <path class="flowGold" d="M 1200 470 L 1318 470"/>
  <path class="flowGray" d="M 1525 546 L 1525 570"/>
  <text class="edgeLabel" x="1540" y="564">막히면</text>
  <path class="flow" d="M 1525 722 L 1525 746"/>
  <text class="edgeLabel" x="1540" y="740">의견 합집합</text>
  <path class="flow" d="M 1318 850 L 1160 850 L 1160 620 L 1072 620"/>
  <text class="edgeLabel" x="1170" y="760">C/H만 반영</text>

  <text class="foot" x="60" y="1140">2026-09-16 현행화 · SKILL.md v0.7(2026-09-16) 기준 · 리뷰어 3(의견) + 작성자(수정) + 교차검증자 1(채점) + 외부 자문 2 · 루프 3~10회 · 100점 = CV(Claude)</text>
</svg>
